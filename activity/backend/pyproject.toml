[project]
name = "hablemos-activity-backend"
version = "0.1.0"
description = "FastAPI backend for the Hablemos Discord Activity"
requires-python = "==3.12.*"
dependencies = [
    "fastapi~=0.118",
    "uvicorn[standard]~=0.37",
    "httpx~=0.28",
    "python-dotenv~=1.2",
    "asyncpg~=0.31",
    "cryptography>=44,<51",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
]
