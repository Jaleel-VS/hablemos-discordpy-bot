name: Deploy to Lightsail

# Builds and deploys the two container services to AWS Lightsail.
# Path filters keep bot-only and activity-only changes from rebuilding both.
# Manual runs (workflow_dispatch) can force either or both.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_bot:
        description: "Deploy the bot service"
        type: boolean
        default: true
      deploy_activity:
        description: "Deploy the activity service"
        type: boolean
        default: true
      deploy_logforwarder:
        description: "Deploy the log forwarder service"
        type: boolean
        default: true

concurrency:
  # Never run two deploys of the same ref at once (Lightsail allows one active deploy per service).
  group: deploy-lightsail-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # Detect which parts of the monorepo changed so we only rebuild what's needed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      activity: ${{ steps.filter.outputs.activity }}
      logforwarder: ${{ steps.filter.outputs.logforwarder }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            activity:
              - 'activity/**'
              - 'deploy/activity.*'
              - 'scripts/lightsail_deploy.sh'
              - '.github/workflows/deploy-lightsail.yml'
            logforwarder:
              - 'logforwarder/**'
              - 'deploy/logforwarder.*'
              - 'scripts/lightsail_deploy.sh'
              - '.github/workflows/deploy-lightsail.yml'
            # Explicit allowlist of what goes into the bot image. dorny's
            # picomatch OR-s list entries, so leading-'!' negation of a '**'
            # catch-all does NOT subtract — an allowlist is the reliable way to
            # scope this. Keep in sync with the bot's runtime source + build.
            bot:
              - 'cogs/**'
              - 'db/**'
              - 'base_cog.py'
              - 'config.py'
              - 'hablemos.py'
              - 'logger.py'
              - 'requirements.txt'
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/bot.containers.json'
              - 'scripts/lightsail_deploy.sh'
              - '.github/workflows/deploy-lightsail.yml'

  deploy-activity:
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.activity == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_activity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build activity image (linux/amd64)
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_DISCORD_CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}" \
            -t hablemos-activity:ci activity/

      - name: Render container config
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Restrict substitution to these exact vars (leave __IMAGE__ and any
          # literal '$' in values untouched).
          envsubst '$DISCORD_CLIENT_ID $DISCORD_CLIENT_SECRET $DATABASE_URL' \
            < deploy/activity.containers.json > /tmp/activity.containers.json

      - name: Push image and deploy
        run: |
          chmod +x scripts/lightsail_deploy.sh
          scripts/lightsail_deploy.sh \
            hablemos-activity \
            hablemos-activity:ci \
            /tmp/activity.containers.json \
            deploy/activity.endpoint.json

  deploy-bot:
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.bot == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_bot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build bot image (linux/amd64)
        run: docker build --platform linux/amd64 -t hablemos-bot:ci .

      - name: Render container config
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACTIVITY_RESULTS_CHANNEL_ID: ${{ secrets.ACTIVITY_RESULTS_CHANNEL_ID }}
          TICKETSUB_MIN_ROLE_ID: ${{ secrets.TICKETSUB_MIN_ROLE_ID }}
          WCBET_AUTO_SETTLE: ${{ secrets.WCBET_AUTO_SETTLE }}
          LOG_WEBHOOK_URL: ${{ secrets.LOG_WEBHOOK_URL }}
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
        run: |
          # Restrict substitution to these exact vars so a '$' inside any secret
          # value (or the literal "$" PREFIX) is never touched.
          envsubst '$BOT_TOKEN $DATABASE_URL $GEMINI_API_KEY $ACTIVITY_RESULTS_CHANNEL_ID $TICKETSUB_MIN_ROLE_ID $WCBET_AUTO_SETTLE $LOG_WEBHOOK_URL $APP_AWS_ACCESS_KEY_ID $APP_AWS_SECRET_ACCESS_KEY' \
            < deploy/bot.containers.json > /tmp/bot.containers.json
          # Fail fast if the token didn't render to its expected length.
          python3 -c "import json; t=json.load(open('/tmp/bot.containers.json'))['app']['environment']['BOT_TOKEN']; assert 50 < len(t) < 100 and t.count('.')==2, f'BOT_TOKEN looks wrong: len={len(t)} dots={t.count(chr(46))}'; print('BOT_TOKEN rendered OK, len', len(t))"

      - name: Push image and deploy
        run: |
          chmod +x scripts/lightsail_deploy.sh
          scripts/lightsail_deploy.sh \
            hablemos-discordpy-bot \
            hablemos-bot:ci \
            /tmp/bot.containers.json

  deploy-logforwarder:
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.logforwarder == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_logforwarder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build logforwarder image (linux/amd64)
        run: docker build --platform linux/amd64 -t hablemos-logforwarder:ci logforwarder/

      - name: Render container config
        env:
          LOGFWD_AWS_ACCESS_KEY_ID: ${{ secrets.LOGFWD_AWS_ACCESS_KEY_ID }}
          LOGFWD_AWS_SECRET_ACCESS_KEY: ${{ secrets.LOGFWD_AWS_SECRET_ACCESS_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
        run: |
          envsubst '$LOGFWD_AWS_ACCESS_KEY_ID $LOGFWD_AWS_SECRET_ACCESS_KEY $AXIOM_TOKEN' \
            < deploy/logforwarder.containers.json > /tmp/logforwarder.containers.json

      - name: Push image and deploy
        run: |
          chmod +x scripts/lightsail_deploy.sh
          scripts/lightsail_deploy.sh \
            hablemos-logforwarder \
            hablemos-logforwarder:ci \
            /tmp/logforwarder.containers.json
