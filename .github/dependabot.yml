version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /activity/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: uv
    directories:
      - /
      - /activity/backend
      - /logforwarder
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /activity
      - /logforwarder
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # The base image's Python must match requires-python (==3.12.*) in each
      # pyproject.toml; a 3.x jump breaks `uv sync --locked` in every image.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
